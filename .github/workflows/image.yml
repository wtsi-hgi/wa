name: Image

on:
    pull_request:
        branches:
            - develop
    push:
        tags:
            - "v*"

permissions:
    contents: read

env:
    IMAGE: ghcr.io/wtsi-hgi/wa

jobs:
    build:
        name: Build and smoke-test image
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  push: false
                  tags: wa:ci
                  build-args: |
                      VERSION=pr-${{ github.event.pull_request.number }}

            - name: Run wa --help
              run: docker run --rm wa:ci --help

            - name: Check wa version prints the build-arg version
              run: test "$(docker run --rm wa:ci version)" = "pr-${{ github.event.pull_request.number }}"

            - name: Serve an empty cache and check /health and /freshness
              run: |
                  printf '%s\n' \
                      WA_PROD_SEQMETA_HOST=0.0.0.0 \
                      WA_MLWH_CACHE_PATH=/data/mlwh-cache.sqlite \
                      WA_MLWH_FEEDBACK_PATH=/data/mlwh-feedback.sqlite \
                      WA_MLWH_USAGE_PATH=/data/mlwh-usage.sqlite \
                      > "$RUNNER_TEMP/env.production.local"
                  docker run -d --name wa-smoke -p 8091:8091 \
                      -v "$RUNNER_TEMP/env.production.local:/app/.env.production.local:ro" \
                      wa:ci --env production mlwh serve
                  healthy=false
                  for _ in $(seq 30); do
                      if curl -fsS http://127.0.0.1:8091/health; then
                          healthy=true
                          break
                      fi
                      sleep 1
                  done
                  if [ "$healthy" != true ]; then
                      echo "wa mlwh serve never became healthy after 30 attempts" >&2
                      exit 1
                  fi
                  curl -fsS http://127.0.0.1:8091/freshness | grep -q '"tables"'
                  docker exec wa-smoke test -s /data/.wa-mlwh-server.token

            - name: Show server log
              if: always()
              run: docker logs wa-smoke || true

    publish:
        name: Publish image
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{raw}}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
